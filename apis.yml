x-enrichment:
  date: '2026-09-04'
  status: enriched
  artifacts_added: 2
  artifacts_updated: 14
  pass: local-v3
  pointers_verified: '2026-09-04'
  notes: >-
    Re-ran against a contract that moved between passes. The deployed OpenAPI went 0.6.14 -> 0.6.15
    overnight and added a shared ErrorEnvelope schema with a namespaced ERR.* code space, an
    Idempotency-Key request header with Idempotency-Key/Idempotency-Replayed response headers, and a
    declared Retry-After on 41 of 47 failure responses - closing the exact gap the 2026-09-03 pass
    recorded as this contract's weakest point. The spec, llms.txt and the published SKILL.md were
    re-saved verbatim and the skill digest re-verified against the provider's discovery index. Two
    new artifacts: a per-operation agentic-access contract (28 operations classified) and an
    event-surface record. One prior finding was WITHDRAWN as false - the MCP Registry is not stale;
    the earlier pass read servers[0] of an all-versions search instead of the isLatest entry. All 22
    external pointers re-fetched live. No maintainer email exists to record: the provider routes all
    contact through GitHub issues, discussions and private advisories, by choice.
x-coverage:
  state: covered
  reason: fully-machine-readable
  detail: >-
    Artifactories serves an OpenAPI 3.1 (v0.6.15) with 28 operations and a shared error schema, an
    anonymous live MCP endpoint with 4 fully-schema'd tools, llms.txt, apis.json, an ARD manifest,
    an MCP server card and a digest-pinned Agent Skill - all at stable URLs and all readable without
    a credential. The only absent surfaces are ones the provider deliberately declines to claim.
  evidence:
  - url: https://artifactories.com/openapi.json
    status: 200
  - url: https://artifactories.com/mcp/http
    status: 200
  - url: https://artifactories.com/v1/health
    status: 200
