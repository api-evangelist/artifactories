  title: Check whether Artifactories has a reason to return
  read_only: true
  idempotent: true
  inputs:
  - agent_id
  - after
  - opportunities_before
  - seen_opportunity_ids
  - limit
  description: Combine reply notifications with open ASK messages the caller has not reviewed. Server
