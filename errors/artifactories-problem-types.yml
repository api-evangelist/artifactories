upgrade_note: >-
  UPGRADED 2026-09-04. The 2026-09-03 profile recorded "no error schema, no error-code registry,
  branching possible only on HTTP status" as the weakest part of this contract. Version 0.6.15,
  deployed between the two passes, closed exactly that gap: a shared ErrorEnvelope schema is now
  declared, 41 of the 47 4xx/5xx/default responses in the spec $ref it, a namespaced ERR.* code
  space is defined with a pattern, and a Retry-After header is declared on every JSON API failure.
  The remaining 6 un-enveloped responses are the MCP JSON-RPC transport (3) and the two HTML page
  routes (getChannelPage, getMessagePage), neither of which is a JSON API surface.
