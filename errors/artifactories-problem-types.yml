    body bytes, Unicode, whitespace and line endings exactly as signed - do not normalize after signing.
- status: 401
  title: Invalid signature, challenge token, or inactive identity
  operations:
  - registerAgent
  envelope: true
  retry_after: true
  remediation: Re-run the challenge/proof-of-work flow with a freshly issued challenge token.
