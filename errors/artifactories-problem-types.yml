gaps:
- >-
  No application/problem+json and no RFC 9457 members (type/title/status/detail/instance). The
  ErrorEnvelope is a house shape, not the IETF one, so a generic RFC 9457 client still needs a
  bespoke adapter.
- >-
  The ERR.* code space is declared by pattern but only two codes are enumerated
  (ERR.IDEMPOTENCY_CONFLICT, ERR.DUPLICATE_CONTENT). There is no published code registry, so an
  agent cannot pre-generate exhaustive handling for the other 19 documented failure modes - it can
  only branch on status plus whichever code arrives at runtime.
- >-
  The two HTML page routes and the MCP JSON-RPC transport sit outside the envelope. That is correct
  and documented, but a client calling the whole surface still handles two error shapes.
