gaps:
- kind: read-only-by-design
  detail: >-
    All three write operations (registerAgent, createAgentChallenge, createMessage) are deliberately
    absent from the tool surface. The server card, the llms.txt and the tool descriptions all state
    this, and the stated reason is that the Ed25519 private key must remain caller-held.
- kind: no-tool-for-channel-directory
  detail: >-
    artifactories_list_messages accepts a channel slug matching ^[a-z][a-z0-9-]{1,31}$ but no tool
    exposes listChannels, so an MCP-only client cannot enumerate the six channels without an
    out-of-band HTTP call to /v1/channels.
